name: cpu-get-c-regular

on:
  workflow_dispatch:
    inputs:
      runner_labels:
        description: JSON array of runner labels
        required: true
        default: '["cpu_benchmark"]'
        type: string
      node_label:
        description: Optional node label for logging only
        required: false
        default: "m6980m02"
        type: string
      docker_image:
        description: Full docker image URI used for server and client containers
        required: true
        default: vllm/vllm-openai-cpu:v0.24.0
        type: string
      case_list_xlsx:
        description: Manifest path relative to repo root (.xlsx or .json). The .json schema supports per-row input/output length and sla columns.
        required: false
        default: automation_v2.json
        type: string
      case_list_sheet:
        description: Workbook sheet name
        required: false
        default: serving_tuning
        type: string
      continue_on_case_failure:
        description: Continue remaining case-list rows after a failed row
        required: false
        default: true
        type: boolean
      validate_output_layout_only:
        description: Only validate output paths without running benchmark
        required: false
        default: false
        type: boolean
      model:
        description: Optional model_id filter; supports a single model or a comma-separated list
        required: false
        default: ''
        type: string
      cache_path:
        description: Optional cache root override mounted into containers
        required: false
        default: ''
        type: string
      server_extra_args:
        description: Extra server launch arguments
        required: false
        default: --trust-remote-code --no-enable-prefix-caching --max-num-batched-tokens=16384 --gpu-memory-utilization=0.8
        type: string

permissions:
  contents: write

jobs:
  get-c-regular:
    runs-on: ${{ fromJSON(inputs.runner_labels || '["self-hosted","linux","x64"]') }}
    timeout-minutes: 4320
    env:
      WORKSPACE: ${{ github.workspace }}
      NODE_LABEL: ${{ inputs.node_label }}
      HF_TOKEN_FOR_SCRIPT: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN_FOR_SCRIPT:-}" ]]; then
            echo "Missing required secret HF_TOKEN"
            exit 1
          fi

      - name: Clean up stale vLLM containers
        shell: bash
        run: |
          set -uo pipefail
          stale=$(docker ps -aq --filter "name=^/vllm-" || true)
          if [[ -n "${stale}" ]]; then
            echo "Cleaning up stale containers:"
            docker ps -a --filter "name=^/vllm-" --format '  {{.Names}} ({{.Status}})' || true
            for cid in ${stale}; do
              docker stop "${cid}" >/dev/null 2>&1 || true
              docker rm -f "${cid}" >/dev/null 2>&1 || true
            done
          else
            echo "No stale vLLM containers found."
          fi

      - name: Install Python dependency
        shell: bash
        run: python3 -m pip install --user --quiet openpyxl

      - name: Validate workbook input
        shell: bash
        run: |
          set -euo pipefail
          manifest_path="${WORKSPACE}/${{ inputs.case_list_xlsx }}"
          sheet_name='${{ inputs.case_list_sheet }}'

          echo "Validating manifest: ${manifest_path}"
          python3 - "${manifest_path}" "${sheet_name}" <<'PY'
          import sys
          import json
          from pathlib import Path
          from openpyxl import load_workbook

          manifest_path = Path(sys.argv[1])
          sheet_name = sys.argv[2]

          if not manifest_path.exists():
            raise SystemExit(f"Manifest not found: {manifest_path}")

          if manifest_path.suffix.lower() == ".json":
            with open(manifest_path, encoding="utf-8") as handle:
              rows = json.load(handle)
            print(f"Manifest OK: {manifest_path}")
            print("Format: json")
            print(f"Rows: {len(rows)}")
            raise SystemExit(0)

          wb = load_workbook(manifest_path, read_only=True)
          if sheet_name not in wb.sheetnames:
            raise SystemExit(f"Sheet not found: {sheet_name}; available={wb.sheetnames}")

          ws = wb[sheet_name]
          print(f"Manifest OK: {manifest_path}")
          print("Format: xlsx")
          print(f"Sheet OK: {sheet_name}")
          print(f"Dimensions: rows={ws.max_row} cols={ws.max_column}")
          PY

      - name: Run get_C_regular
        shell: bash
        run: |
          set -euo pipefail

          export IMAGE='${{ inputs.docker_image }}'
          export REPO="${WORKSPACE}"
          export CACHE='${{ inputs.cache_path }}'
          export MODEL='${{ inputs.model }}'
          export DTYPE='bfloat16'
          export DEVICE='cpu'
          export HARDWARE='emr'
          export SERVER_EXTRA_ARGS='${{ inputs.server_extra_args }}'
          export RUN_FROM_CASE_LIST='1'
          export CONTINUE_ON_CASE_FAILURE='${{ inputs.continue_on_case_failure && '1' || '0' }}'
          export VALIDATE_OUTPUT_LAYOUT_ONLY='${{ inputs.validate_output_layout_only && '1' || '0' }}'
          export CASE_LIST_XLSX="${WORKSPACE}/${{ inputs.case_list_xlsx }}"
          export CASE_LIST_SHEET='${{ inputs.case_list_sheet }}'
          export CASE_LIST_MODEL_FILTER='${{ inputs.model }}'

          echo "Node label: ${NODE_LABEL}"
          echo "Workspace: ${WORKSPACE}"
          echo "Image: ${IMAGE}"
          echo "Case list manifest: ${CASE_LIST_XLSX}"
          echo "Case-list model filter: ${CASE_LIST_MODEL_FILTER}"

          bash "${WORKSPACE}/scripts/sweep/get_C_regular.sh"

      - name: Persist sweep results
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          manifest_rel='${{ inputs.case_list_xlsx }}'
          manifest_path="${WORKSPACE}/${manifest_rel}"

          if [[ "${manifest_rel,,}" != *.json ]]; then
            echo "Manifest is not JSON (${manifest_rel}); skip auto-commit."
            exit 0
          fi

          # Results live in a sibling file; the source manifest itself is never rewritten.
          results_rel="${manifest_rel%.json}.new.json"
          results_path="${manifest_path%.json}.new.json"
          if [[ ! -f "${results_path}" ]]; then
            echo "No results file found at ${results_path}; skip auto-commit."
            exit 0
          fi

          cd "${WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${results_rel}"
          if git diff --cached --quiet -- "${results_rel}"; then
            echo "No results changes to commit."
            git restore --staged -- "${results_rel}" 2>/dev/null || true
            exit 0
          fi

          git commit -m "Update ${results_rel} from cpu-get-c-regular run #${{ github.run_number }}"

          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Push rejected; fetching + rebasing once before retrying." >&2
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort
              echo "ERROR: rebase conflict; push the results update manually." >&2
              exit 1
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload get_c_regular logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: get-c-regular-logs
          path: |
            logs/get_c_regular/**
          if-no-files-found: ignore

      - name: Clean up vLLM containers
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          stale=$(docker ps -aq --filter "name=^/vllm-" || true)
          if [[ -n "${stale}" ]]; then
            echo "Cleaning up vLLM containers:"
            docker ps -a --filter "name=^/vllm-" --format '  {{.Names}} ({{.Status}})' || true
            for cid in ${stale}; do
              docker stop "${cid}" >/dev/null 2>&1 || true
              docker rm -f "${cid}" >/dev/null 2>&1 || true
            done
          else
            echo "No vLLM containers to remove."
          fi